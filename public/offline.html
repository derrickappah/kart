<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316">
  <title>KART - Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #1daddd;
      --primary-hover: #1796c0;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --icon-bg: rgba(29, 173, 221, 0.12);
      --icon-color: #1daddd;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121316;
        --card-bg: #242428;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --border: #374151;
        --icon-bg: rgba(29, 173, 221, 0.2);
        --icon-color: #34bcff;
        --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      }
    }

    /* Fallback support for class-based dark mode */
    html.dark {
      --bg: #121316;
      --card-bg: #242428;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border: #374151;
      --icon-bg: rgba(29, 173, 221, 0.2);
      --icon-color: #34bcff;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .icon-wrapper {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--icon-bg);
      color: var(--icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
      transition: color 0.3s ease;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 28px;
      transition: color 0.3s ease;
    }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Connection</h1>
    <p>Please check your internet connection or mobile data and try again.</p>
    <button class="btn" id="retry-btn" onclick="retryConnection()">
      <span class="spinner" id="spinner"></span>
      <span id="btn-text">Retry</span>
    </button>
  </div>

  <script>
    // Explicit sync with system dark/light theme
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    function handleThemeChange(e) {
      if (e.matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    if (themeMedia.addEventListener) {
      themeMedia.addEventListener('change', handleThemeChange);
    } else if (themeMedia.addListener) {
      themeMedia.addListener(handleThemeChange);
    }
    handleThemeChange(themeMedia);

    const TARGET_URL = 'https://www.kart.cx';

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.innerText = 'Connecting...';

      fetch(TARGET_URL, { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          window.location.replace(TARGET_URL);
        })
        .catch(() => {
          setTimeout(() => {
            btn.disabled = false;
            spinner.style.display = 'none';
            btnText.innerText = 'Retry';
          }, 800);
        });
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', () => {
      retryConnection();
    });
  </script>
</body>
</html>
